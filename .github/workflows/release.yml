name: Release

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      tests_run_id:
        description: "Successful Tests run ID (the number in its Actions URL)"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-tests-${{ inputs.tests_run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  release-plan:
    name: Verify tests and release version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tested-revision: ${{ steps.context.outputs.tested-revision }}
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Verify successful Tests run
        id: tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TESTS_RUN_ID: ${{ inputs.tests_run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [[ "$TESTS_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$TESTS_RUN_ID" > "$RUNNER_TEMP/release-tests-run.json"
          python3 - <<'PY'
          import json, os, pathlib
          run = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "release-tests-run.json").read_text())
          assert run["path"] == ".github/workflows/test.yml", "Select a Tests workflow run."
          assert run["event"] == "workflow_run", "Tests must come from the Build workflow."
          assert run["repository"]["full_name"] == os.environ["GH_REPO"], "Wrong Tests repository."
          assert run["status"] == "completed" and run["conclusion"] == "success", "Tests have not passed."
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f'tests-run-id={int(run["id"])}\n')
          PY

      - name: Download successful test context
        uses: actions/download-artifact@v5
        with:
          name: remmich-release-context
          path: ${{ runner.temp }}/RemmichReleaseContext
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.tests.outputs.tests-run-id }}

      - name: Verify original Build and tested revision
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          build_run_id="$(python3 - <<'PY'
          import json, os, pathlib, re
          receipt = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "RemmichReleaseContext/release-context.json").read_text())
          assert type(receipt["build_run_id"]) is int and receipt["build_run_id"] > 0, "Invalid Build run ID."
          assert re.fullmatch(r"[0-9a-f]{40}", receipt["tested_revision"]), "Invalid tested revision."
          print(receipt["build_run_id"])
          PY
          )"
          gh api "repos/$GH_REPO/actions/runs/$build_run_id" > "$RUNNER_TEMP/release-build-run.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          tests = json.loads((root / "release-tests-run.json").read_text())
          receipt = json.loads((root / "RemmichReleaseContext/release-context.json").read_text())
          build = json.loads((root / "release-build-run.json").read_text())
          assert build["path"] == ".github/workflows/build.yml", "Receipt must identify Build."
          assert build["repository"]["full_name"] == os.environ["GH_REPO"], "Wrong Build repository."
          assert build["status"] == "completed" and build["conclusion"] == "success", "Build has not passed."
          assert build["head_sha"] == receipt["tested_revision"], "Tests and Build revisions differ."
          assert tests["head_sha"] == build["head_sha"], "Tests run does not match the original Build revision."
          assert tests["head_branch"] == build["head_branch"], "Tests and Build branches differ."
          assert tests["head_repository"]["full_name"] == build["head_repository"]["full_name"], "Tests and Build origins differ."
          eligible = (
              build["head_repository"]["full_name"] == os.environ["GH_REPO"]
              and build["event"] in ("push", "workflow_dispatch")
              and build["head_branch"] in ("main", "develop")
          )
          if eligible and os.environ["RELEASE_EVENT"] == "workflow_dispatch":
              assert build["head_branch"] == os.environ["RELEASE_BRANCH"], "Select the branch matching the Tests run."
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f'eligible={str(eligible).lower()}\n')
              if eligible:
                  output.write(f'tested-revision={receipt["tested_revision"]}\n')
                  output.write(f'source-event={build["event"]}\nsource-branch={build["head_branch"]}\n')
          if not eligible:
              print("This Tests run is not eligible for release.")
          PY

      - name: Check out tested revision
        if: steps.context.outputs.eligible == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.context.outputs.tested-revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check version and release tag
        if: steps.context.outputs.eligible == 'true'
        id: version
        env:
          SOURCE_EVENT: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || steps.context.outputs.source-event }}
          SOURCE_BRANCH: ${{ steps.context.outputs.source-branch }}
        run: |
          set -euo pipefail
          # Match EdgeMark: project changes release automatically; a manual
          # Build run can release the current version without another bump.
          if [[ "$SOURCE_EVENT" != "workflow_dispatch" ]] && git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --quiet HEAD^ HEAD -- Remmich.xcodeproj/project.pbxproj; then
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          python3 - <<'PY'
          import os, pathlib, re
          project = pathlib.Path("Remmich.xcodeproj/project.pbxproj").read_text()
          versions = set(re.findall(r"MARKETING_VERSION = ([^;]+);", project))
          builds = set(re.findall(r"CURRENT_PROJECT_VERSION = ([^;]+);", project))
          if len(versions) != 1 or len(builds) != 1:
              raise SystemExit("App and test targets must agree on version and build.")
          version, build = versions.pop().strip(), builds.pop().strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version) or not build.isdecimal():
              raise SystemExit("Expected a numeric major.minor.patch version and build.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\nbuild={build}\n")
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-version").write_text(version)
          PY
          version="$(<"$RUNNER_TEMP/release-version")"
          prerelease=false
          tag="v$version"
          if [[ "$SOURCE_BRANCH" == "develop" ]]; then
            prerelease=true
            beta=1
            while git rev-parse --verify "refs/tags/v${version}-beta.${beta}" >/dev/null 2>&1; do
              beta=$((beta + 1))
            done
            tag="v${version}-beta.${beta}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; leaving its release unchanged."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  archive:
    name: Archive optimized iOS app
    needs: release-plan
    if: needs.release-plan.outputs.release == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plan.outputs.tested-revision }}
          persist-credentials: false

      - name: Archive Release for iOS devices
        run: |
          set -euo pipefail
          xcodebuild archive -quiet \
            -project Remmich.xcodeproj \
            -scheme Remmich \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Remmich.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/RemmichReleaseBuild" \
            -skipPackagePluginValidation \
            -jobs 2 \
            -parallel-testing-enabled NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            SWIFT_OPTIMIZATION_LEVEL=-O SWIFT_COMPILATION_MODE=wholemodule \
            DEBUG_INFORMATION_FORMAT=dwarf-with-dsym \
            STRIP_INSTALLED_PRODUCT=YES COPY_PHASE_STRIP=YES

      - name: Verify archive did not modify checked-out sources
        run: git diff --exit-code

      - name: Package unsigned IPA and debug symbols
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
          RELEASE_BUILD: ${{ needs.release-plan.outputs.build }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Remmich.xcarchive/Products/Applications/Remmich.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")" = "$RELEASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$RELEASE_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$app/Info.plist")" = "iphoneos"
          xcrun lipo -archs "$app/Remmich" | grep -w arm64
          mkdir -p "$RUNNER_TEMP/RemmichIPA/Payload" "$RUNNER_TEMP/RemmichRelease"
          git log -1 --format=%b > "$RUNNER_TEMP/RemmichRelease/release-notes.md"
          ditto "$app" "$RUNNER_TEMP/RemmichIPA/Payload/Remmich.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/RemmichIPA/Payload" \
            "$RUNNER_TEMP/RemmichRelease/Remmich-${RELEASE_TAG}-unsigned.ipa"
          test -d "$RUNNER_TEMP/Remmich.xcarchive/dSYMs"
          ditto -c -k --keepParent "$RUNNER_TEMP/Remmich.xcarchive/dSYMs" \
            "$RUNNER_TEMP/RemmichRelease/Remmich-${RELEASE_TAG}-dSYMs.zip"
          cd "$RUNNER_TEMP/RemmichRelease"
          for asset in *.ipa *.zip; do
            shasum -a 256 "$asset" > "$asset.sha256"
          done

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: remmich-release-${{ needs.release-plan.outputs.tested-revision }}
          path: ${{ runner.temp }}/RemmichRelease/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [release-plan, archive]
    if: needs.release-plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-${{ needs.release-plan.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download release files
        uses: actions/download-artifact@v5
        with:
          name: remmich-release-${{ needs.release-plan.outputs.tested-revision }}
          path: release-files

      - name: Publish tested version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          RELEASE_BUILD: ${{ needs.release-plan.outputs.build }}
          PRERELEASE: ${{ needs.release-plan.outputs.prerelease }}
          TESTED_REVISION: ${{ needs.release-plan.outputs.tested-revision }}
        run: |
          set -euo pipefail
          cd release-files
          sha256sum -c ./*.sha256
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" ./*.ipa ./*.zip ./*.sha256 \
            --target "$TESTED_REVISION" \
            --title "$RELEASE_TAG (build $RELEASE_BUILD)" \
            --notes-file release-notes.md \
            "${flags[@]}"

  update-source:
    name: Update SideStore source
    needs: [release-plan, release]
    if: needs.release-plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sidestore-source
      cancel-in-progress: false
    steps:
      - name: Check out current source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Update source from published IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
          SOURCE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          gh release download "$RELEASE_TAG" --pattern '*-unsigned.ipa' --pattern '*-unsigned.ipa.sha256' --dir "$RUNNER_TEMP/source-ipa"
          (cd "$RUNNER_TEMP/source-ipa" && sha256sum -c ./*.sha256)
          python3 Scripts/update-sidestore-source.py \
            --source source.json --release "$RUNNER_TEMP/release.json" \
            --ipa "$RUNNER_TEMP/source-ipa/Remmich-${RELEASE_TAG}-unsigned.ipa"
          if git diff --quiet -- source.json; then
            exit 0
          fi
          # Use the checked-out blob SHA so concurrent edits fail safely.
          python3 - <<'PY' > "$RUNNER_TEMP/source-update.json"
          import base64, json, os, pathlib, subprocess
          print(json.dumps({
              "message": "docs: update SideStore source for " + os.environ["RELEASE_TAG"],
              "content": base64.b64encode(pathlib.Path("source.json").read_bytes()).decode(),
              "sha": subprocess.check_output(["git", "rev-parse", "HEAD:source.json"], text=True).strip(),
              "branch": os.environ["SOURCE_BRANCH"],
          }))
          PY
          gh api --silent --method PUT "repos/$GH_REPO/contents/source.json" --input "$RUNNER_TEMP/source-update.json"
