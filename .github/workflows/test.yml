name: Tests

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: tests-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      IPHONE_DESTINATION: platform=iOS Simulator,name=iPhone 17e,OS=27.0
      IPAD_DESTINATION: platform=iOS Simulator,name=iPad Air 13-inch (M4),OS=27.0

    steps:
      - name: Require a successful build
        env:
          BUILD_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [[ "$BUILD_CONCLUSION" != "success" ]]; then
            echo "The triggering Build workflow concluded with: $BUILD_CONCLUSION"
            exit 1
          fi

      - name: Download test products
        uses: actions/download-artifact@v5
        with:
          name: remmich-test-products
          path: ${{ runner.temp }}/RemmichBuildArtifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Restore test products
        id: test-products
        run: |
          test_products_path="$RUNNER_TEMP/RemmichTestProducts"
          mkdir -p "$test_products_path"
          tar -C "$test_products_path" \
            -xzf "$RUNNER_TEMP/RemmichBuildArtifact/remmich-test-products.tar.gz"
          tested_revision="$(<"$test_products_path/tested-revision")"
          if [[ ! "$tested_revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The downloaded build artifact has an invalid tested revision."
            exit 1
          fi
          xctestrun_path="$(find "$test_products_path/Products" -maxdepth 1 -name '*.xctestrun' -print -quit)"
          if [[ -z "$xctestrun_path" ]]; then
            echo "No xctestrun file was found in the downloaded build products."
            exit 1
          fi
          echo "tested-revision=$tested_revision" >> "$GITHUB_OUTPUT"
          echo "XCTESTRUN_PATH=$xctestrun_path" >> "$GITHUB_ENV"

      - name: Check out tested revision
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.test-products.outputs.tested-revision }}

      - name: Test Immich API package
        run: swift test --jobs 2 --package-path Packages/ImmichAPI

      - name: Boot iPhone simulator
        run: |
          xcrun simctl boot "iPhone 17e" || true
          xcrun simctl bootstatus "iPhone 17e" -b

      - name: Test app logic
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -destination "$IPHONE_DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/RemmichUnitTests.xcresult" \
            -jobs 2 \
            -parallel-testing-enabled NO \
            -only-testing:RemmichTests \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: Test iPhone UI smoke journeys
        run: |
          set -o pipefail

          run_ui_tests() {
            local result_bundle="$1"
            local log_path="$2"
            shift 2
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN_PATH" \
              -destination "$IPHONE_DESTINATION" \
              -resultBundlePath "$result_bundle" \
              -jobs 2 \
              -parallel-testing-enabled NO \
              "$@" \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 240 \
              -maximum-test-execution-time-allowance 360 \
              -collect-test-diagnostics never \
              COMPILER_INDEX_STORE_ENABLE=NO \
              2>&1 | tee "$log_path" | xcbeautify
            return "${PIPESTATUS[0]}"
          }

          smoke_tests=(
            -only-testing:RemmichUITests/RemmichUITests/testPrimaryNavigationAndAccountSheet
            -only-testing:RemmichUITests/RemmichUITests/testAlbumFilterSurvivesTabSwitch
            -only-testing:RemmichUITests/RemmichUITests/testPhotoViewerOpensExactAssetAdaptsToRotationAndRestoresTimeline
            -only-testing:RemmichUITests/RemmichUITests/testPhotoViewerPagesBackAndForthWithoutLosingSelection
            -only-testing:RemmichUITests/RemmichUITests/testAssetViewerDragDismissesWithChromeShownAndHidden
            -only-testing:RemmichUITests/RemmichUITests/testAssetViewerRespectsSafeAreasAndRevealsInfo
            -only-testing:RemmichUITests/RemmichUITests/testLivePhotoViewerPreparesAndPlaysFromHold
            -only-testing:RemmichUITests/RemmichUITests/testVideoViewerUsesNativePlayerAndRestoresTimeline
            -only-testing:RemmichUITests/RemmichUITests/testPhotosTimelineInitialFailureRetriesWithoutRelaunch
            -only-testing:RemmichUITests/RemmichUITests/testGroupedTileOpensWithItsVisibleCoverOnScreen
            -only-testing:RemmichUITests/RemmichUITests/testSignedOutLaunchShowsNativeOnboarding
          )

          set +e
          run_ui_tests \
            "$RUNNER_TEMP/RemmichUITests-Smoke.xcresult" \
            "$RUNNER_TEMP/RemmichUITests-Smoke.log" \
            "${smoke_tests[@]}"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if [[ -d "$RUNNER_TEMP/RemmichUITests-Smoke.xcresult" ]]; then
            echo "iPhone UI smoke test failures from XCResult:"
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/RemmichUITests-Smoke.xcresult" || true
          fi
          if ! grep -q "Timed out while launching application via Xcode" \
            "$RUNNER_TEMP/RemmichUITests-Smoke.log"; then
            exit "$status"
          fi

          echo "Simulator launch timed out; rebooting once before retrying UI smoke tests."
          xcrun simctl shutdown "iPhone 17e" || true
          xcrun simctl boot "iPhone 17e"
          xcrun simctl bootstatus "iPhone 17e" -b
          run_ui_tests \
            "$RUNNER_TEMP/RemmichUITests-Smoke-Retry.xcresult" \
            "$RUNNER_TEMP/RemmichUITests-Smoke-Retry.log" \
            "${smoke_tests[@]}"

      - name: Test detailed iPhone UI
        if: ${{ vars.REMMICH_RUN_DETAILED_UI_TESTS == 'true' }}
        continue-on-error: true
        run: |
          set -o pipefail
          set +e
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -destination "$IPHONE_DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/RemmichUITests-Detailed.xcresult" \
            -jobs 2 \
            -parallel-testing-enabled NO \
            -only-testing:RemmichUITests \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 360 \
            -collect-test-diagnostics never \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/RemmichUITests-Detailed.log" | xcbeautify
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "$status" -ne 0 && -d "$RUNNER_TEMP/RemmichUITests-Detailed.xcresult" ]]; then
            echo "Detailed iPhone UI test failures from XCResult:"
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/RemmichUITests-Detailed.xcresult" || true
          fi
          exit "$status"

      - name: Boot iPad simulator
        if: ${{ !cancelled() }}
        run: |
          xcrun simctl shutdown "iPhone 17e" || true
          xcrun simctl boot "iPad Air 13-inch (M4)" || true
          xcrun simctl bootstatus "iPad Air 13-inch (M4)" -b

      - name: Test iPad UI
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN_PATH" \
            -destination "$IPAD_DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/RemmichIPadLayoutTests.xcresult" \
            -jobs 2 \
            -parallel-testing-enabled NO \
            -only-testing:RemmichUITests/RemmichUITests/testPrimaryNavigationAndAccountSheet \
            -only-testing:RemmichUITests/RemmichUITests/testAdaptivePhotoGridUsesAvailableWidth \
            -only-testing:RemmichUITests/RemmichUITests/testPhotoTimelineUsesFullLandscapeWidth \
            -only-testing:RemmichUITests/RemmichUITests/testPhotoViewerOpensExactAssetAdaptsToRotationAndRestoresTimeline \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 360 \
            -collect-test-diagnostics never \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee "$RUNNER_TEMP/RemmichIPadLayoutTests.log" | xcbeautify

      - name: Shut down simulators
        if: ${{ always() }}
        run: xcrun simctl shutdown all || true

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remmich-test-results-${{ github.event.workflow_run.id }}
          path: |
            ${{ runner.temp }}/Remmich*.xcresult
            ${{ runner.temp }}/Remmich*.log
          if-no-files-found: ignore
          retention-days: 7
