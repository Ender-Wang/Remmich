  <rect class="bg" width="1000" height="2444" rx="24"/>
  <text x="40" y="43" class="label">REMMICH / FEATURE TIMELINE</text>
  <text x="960" y="43" text-anchor="end" class="date">UPDATED NOV 9, 2026</text>
  <path class="spine" d="M500 112V2380"/>

