<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2444" viewBox="0 0 1000 2444" role="img" aria-labelledby="title desc">
  <title id="title">Remmich roadmap — Future, Now, then history</title>
  <desc id="desc">Future milestones lead down to Now: Download Pause/Resume and automatic recovery on November 10, 2026. Sharing, Download and Save to Photos and earlier achievements continue below in date order. Native Live Photo sharing is limited by the investigated Apple APIs. Feature icons sit on the central connecting line.</desc>
  <style>
    .bg{fill:#f8fafc}.card{fill:#fff;stroke:#dbe3ee;stroke-width:1.5}.now{fill:#eef2ff;stroke:#818cf8;stroke-width:1.5}
    .spine{fill:none;stroke:#cbd5e1;stroke-width:3}.branch{stroke:#94a3b8;stroke-width:2}.dot{fill:#6366f1;stroke:#f8fafc;stroke-width:5}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#15243b}.date{font-size:13px;fill:#64748b;letter-spacing:.5px}.heading{font-size:19px;font-weight:650}.body{font-size:15px;fill:#475569}.label{font-size:12px;fill:#4f46e5;font-weight:700;letter-spacing:1px}
    @media(prefers-color-scheme:dark){.bg{fill:#0f172a}.card{fill:#172237;stroke:#334155}.now{fill:#23264b;stroke:#818cf8}.spine{stroke:#475569}.branch{stroke:#64748b}.dot{stroke:#0f172a}text{fill:#f1f5f9}.body{fill:#cbd5e1}.date{fill:#94a3b8}.label{fill:#a5b4fc}}
  </style>
  <style>
    .planned{fill:#fff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4}.dot{fill:#f8fafc;r:17px}
    .future-heading{font-size:19px;font-weight:650}.future-label{font-size:12px;fill:#64748b;letter-spacing:.5px}
    @media(prefers-color-scheme:dark){.planned{fill:#172237;stroke:#64748b}.dot{fill:#0f172a}.future-label{fill:#94a3b8}}
  </style>
